<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/*" href="/expenses.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kharchafy | Group Expense & Budget Tracker</title>
    <!--
			Generic fallback only — every real route's title/description/OG/
			Twitter/canonical/hreflang/JSON-LD is injected reactively via
			useHead() (see src/scripts/layout/app.js + src/utils/seo.js) and,
			for the public marketing pages, baked directly into the
			prerendered HTML at build time (see ssgOptions in vite.config.js).
			This tag only briefly shows before that runs, e.g. on
			client-only private app routes.
		-->
    <meta
      name="description"
      content="Kharchafy is a Vue-powered group expense, shared loan, and personal budgeting app that keeps settlements transparent and receipts organized."
    />
    <meta name="author" content="Kharchafy" />
    <meta name="theme-color" content="#16a34a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/expenses.png" />
    <meta name="application-name" content="Kharchafy" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Kharchafy" />
    <!-- Warm up the Google Fonts connection for whichever fonts the inline
         script below ends up injecting — see src/composables/useFontFamily.js. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Default base font, linked directly (not injected by the script
         below) so the browser's preload scanner can start fetching it while
         still parsing this HTML, instead of waiting for the inline script
         to run first. Covers the common case — a first-time visitor, or any
         returning visitor who never changed their font in Settings — with
         zero script-injection delay. data-font-id must match the id
         loadFont()/ensureFontLinkLoaded() dedup on, so a visitor who *did*
         pick "poppins" explicitly doesn't get a second, redundant <link>. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      data-font-id="poppins"
    />
    <style>
      #private-route-reloader {
        display: none;
      }

      html.private-route-reloading #app {
        opacity: 0;
        pointer-events: none;
      }

      html.private-route-reloading #private-route-reloader {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f9fafb;
        color: #111827;
        font-family: var(--font-family-base, 'Poppins', sans-serif);
      }

      html.private-route-reloading.dark-theme #private-route-reloader {
        background: #111827;
        color: #f9fafb;
      }

      .private-route-reloader__box {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        min-height: 44px;
        padding: 10px 16px;
        border: 1px solid rgba(34, 197, 94, 0.28);
        border-radius: 6px;
        background: #ffffff;
        box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
        font-size: 15px;
        font-weight: 700;
      }

      html.private-route-reloading.dark-theme .private-route-reloader__box {
        background: #1f2937;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
      }

      .private-route-reloader__spinner {
        width: 18px;
        height: 18px;
        border: 2px solid rgba(34, 197, 94, 0.22);
        border-top-color: #16a34a;
        border-radius: 50%;
        animation: private-route-reloader-spin 0.8s linear infinite;
      }

      @keyframes private-route-reloader-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <!-- Apply theme + font-family immediately to prevent flash -->
    <script>
      ;(function () {
        // Keep in sync with FONT_OPTIONS in src/composables/useFontFamily.js.
        var GOOGLE_FONTS_CSS2 = 'https://fonts.googleapis.com/css2?family='
        var FONT_STACKS = {
          poppins: {
            stack: "'Poppins', sans-serif",
            href: GOOGLE_FONTS_CSS2 + 'Poppins:wght@300;400;500;600;700&display=swap'
          },
          inter: {
            stack: "'Inter', sans-serif",
            href: GOOGLE_FONTS_CSS2 + 'Inter:wght@300;400;500;600;700&display=swap'
          },
          roboto: {
            stack: "'Roboto', sans-serif",
            href: GOOGLE_FONTS_CSS2 + 'Roboto:wght@300;400;500;600;700&display=swap'
          },
          'open-sans': {
            stack: "'Open Sans', sans-serif",
            href: GOOGLE_FONTS_CSS2 + 'Open+Sans:wght@300;400;500;600;700&display=swap'
          },
          lato: {
            stack: "'Lato', sans-serif",
            href: GOOGLE_FONTS_CSS2 + 'Lato:wght@300;400;700&display=swap'
          },
          montserrat: {
            stack: "'Montserrat', sans-serif",
            href: GOOGLE_FONTS_CSS2 + 'Montserrat:wght@300;400;500;600;700&display=swap'
          }
        }
        // Keep in sync with URDU_FONT_OPTIONS in src/composables/useFontFamily.js.
        var URDU_FONTS = {
          'noto-nastaliq-urdu': {
            stack: "'Noto Nastaliq Urdu', sans-serif",
            lineHeight: '2',
            href:
              GOOGLE_FONTS_CSS2 +
              'Noto+Nastaliq+Urdu:wght@400;500;600;700&display=swap'
          },
          gulzar: {
            stack: "'Gulzar', sans-serif",
            lineHeight: '1.8',
            href: GOOGLE_FONTS_CSS2 + 'Gulzar&display=swap'
          },
          'noto-naskh-arabic': {
            stack: "'Noto Naskh Arabic', sans-serif",
            lineHeight: '1.6',
            href:
              GOOGLE_FONTS_CSS2 +
              'Noto+Naskh+Arabic:wght@400;500;600;700&display=swap'
          }
        }

        // Mirrors ensureFontLinkLoaded() in useFontFamily.js — same
        // data-font-id dedup so this pre-mount injection and that module's
        // own eager apply() never both add the same <link>.
        function loadFont(id, font) {
          if (document.head.querySelector('link[data-font-id="' + id + '"]'))
            return
          var link = document.createElement('link')
          link.rel = 'stylesheet'
          link.href = font.href
          link.setAttribute('data-font-id', id)
          document.head.appendChild(link)
        }

        const applyTheme = () => {
          const savedTheme = localStorage.getItem('theme') || 'light'
          const htmlElement = document.documentElement
          const bodyElement = document.body
          if (!bodyElement) return

          if (savedTheme === 'dark') {
            htmlElement.classList.add('dark-theme')
            htmlElement.classList.remove('light-theme')
            bodyElement.classList.add('dark-theme')
            bodyElement.classList.remove('light-theme')
          } else {
            htmlElement.classList.add('light-theme')
            htmlElement.classList.remove('dark-theme')
            bodyElement.classList.add('light-theme')
            bodyElement.classList.remove('dark-theme')
          }
        }

        const applyFontFamily = () => {
          var savedFontId = localStorage.getItem('fontFamily')
          var fontId = FONT_STACKS[savedFontId] ? savedFontId : 'poppins'
          var font = FONT_STACKS[fontId]
          document.documentElement.style.setProperty(
            '--font-family-base',
            font.stack
          )
          loadFont(fontId, font)

          var savedUrduFontId = localStorage.getItem('urduFontFamily')
          var urduFontId = URDU_FONTS[savedUrduFontId]
            ? savedUrduFontId
            : 'noto-nastaliq-urdu'
          var urduFont = URDU_FONTS[urduFontId]
          document.documentElement.style.setProperty(
            '--font-family-urdu',
            urduFont.stack
          )
          document.documentElement.style.setProperty(
            '--font-line-height-urdu',
            urduFont.lineHeight
          )
          // --font-family-urdu only actually renders anything under the
          // html[lang='ur'] rules in main.css (see useFontFamily.js's
          // header comment) — setting the CSS variable above is free, but
          // fetching its Google Fonts stylesheet is a real render-blocking
          // network request this page has no use for unless it's an Urdu
          // page. Same locale check as the private-route-reloader text
          // script further down this file.
          var isUrduPage =
            window.location.pathname === '/ur' ||
            window.location.pathname.indexOf('/ur/') === 0 ||
            localStorage.getItem('appLocale') === 'ur'
          if (isUrduPage) loadFont(urduFontId, urduFont)
        }

        applyFontFamily()
        document.addEventListener('DOMContentLoaded', applyTheme)
      })()
    </script>
    <script>
      ;(function () {
        // Keep in sync with PUBLIC_BASE_PATHS in src/constants/publicPaths.js
        // (the 8 prerendered marketing pages), plus /login and /register —
        // guest-accessible routes that are public but not prerendered.
        var publicBasePaths = [
          '/',
          '/features',
          '/faq',
          '/help',
          '/group-expense-tracker',
          '/personal-budget-tracker',
          '/terms',
          '/privacy',
          '/login',
          '/register'
        ]
        var path = window.location.pathname || '/'
        if (path === '/ur') path = '/'
        if (path.indexOf('/ur/') === 0) path = path.slice(3) || '/'

        var firstSegment = path.split('/').filter(Boolean)[0]
        var basePath = firstSegment ? '/' + firstSegment : '/'

        if (publicBasePaths.indexOf(basePath) === -1) {
          document.documentElement.classList.add('private-route-reloading')
        }
      })()
    </script>
  </head>
  <body style="padding: 0%; margin: 0%; box-sizing: border-box">
    <noscript>
      <div
        style="padding: 24px; font-family: Arial, sans-serif; line-height: 1.6"
      >
        <h1>Kharchafy</h1>
        <p>
          Kharchafy is a group expense tracker for shared bills, shared loans,
          and personal budgeting.
        </p>
        <p>Useful public pages:</p>
        <ul>
          <li><a href="/">Home</a></li>
          <li><a href="/features">Features</a></li>
          <li><a href="/group-expense-tracker">Group Expense Tracker</a></li>
          <li>
            <a href="/personal-budget-tracker">Personal Budget Tracker</a>
          </li>
          <li><a href="/faq">FAQ</a></li>
          <li><a href="/login">Login</a></li>
          <li><a href="/register">Register</a></li>
        </ul>
      </div>
    </noscript>
    <div id="private-route-reloader" role="status" aria-live="polite">
      <div class="private-route-reloader__box">
        <span class="private-route-reloader__spinner" aria-hidden="true"></span>
        <span id="private-route-reloader-text">Reloading...</span>
      </div>
    </div>
    <script>
      ;(function () {
        var text = document.getElementById('private-route-reloader-text')
        if (!text) return
        var isUrdu =
          window.location.pathname === '/ur' ||
          window.location.pathname.indexOf('/ur/') === 0 ||
          localStorage.getItem('appLocale') === 'ur'
        if (isUrdu) text.textContent = 'دوبارہ لوڈ ہو رہا ہے...'
      })()
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
